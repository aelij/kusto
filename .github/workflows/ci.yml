name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet build Kusto.Data.Queries.slnx -c Release

      - run: dotnet test -c Release --no-build --report-trx --results-directory TestResults

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: |
            TestResults
            artifacts/bin/Kusto.Data.Queries.CoyoteTests/release/CoyoteTraces
